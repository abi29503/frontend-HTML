<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse a String</title>
</head>
<body>
    <script>
        let str="Welcome!";
        let reversed="";

        for(let i=str.length-1; i>=0;i--){
            reversed+=str[i];
        }

        console.log("Original String:"+str);
        console.log("Reversed String:"+reversed);
    </script>
</body>
</html>
