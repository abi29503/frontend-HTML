<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Element</title>
</head>
<body>
    <script>
        let flowers=["Rose","Lilly","Lotus","Sunflower"];

        console.log("Original Array:",flowers);

        let removed=flowers.shift();

        console.log("Removed Element: ",removed);
        console.log("Update Array:",flowers);

    </script>

    
</body>
</html>
